# ---------------------------------------------------------------------------
# HUMINT Shield - nginx server block
#
# Serves the compiled SPA and reverse-proxies the API, tracking pixels/links and
# the standalone micro-learning page to the backend so everything lives on one
# origin (required for tracking links inside emails).
# ---------------------------------------------------------------------------
upstream humint_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- API and tracking proxies ----------------------------------------- #
    location /api/ {
        proxy_pass http://humint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Standalone micro-learning page served by the backend.
    location /training/ {
        proxy_pass http://humint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /healthz {
        proxy_pass http://humint_backend/healthz;
        access_log off;
    }

    location = /metrics {
        return 404;
    }

    # --- static assets ----------------------------------------------------- #
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------ #
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

# ---------------------------------------------------------------------------
# HUMINT Shield - nginx server block (SPA + API reverse proxy)
#
# Serves the compiled SPA and reverse-proxies the API, tracking pixels/links and
# the standalone micro-learning page to the backend so everything lives on one
# origin (required for tracking links inside emails).
#
# TLS: this container terminates plain HTTP and is meant to sit behind the edge
# proxy in `nginx/humint-shield.conf`, which owns the certificates, the HTTP->HTTPS
# 301 redirect and HSTS. Publish this port only on the private network.
# ---------------------------------------------------------------------------
upstream humint_backend {
    server backend:8000;
    keepalive 16;
}

# --- network-level rate limiting (module 6) -------------------------------- #
# /api/v1/auth/login: 5 requests/minute/IP. /api/v1/*: 60 requests/minute/IP.
limit_req_zone $binary_remote_addr zone=humint_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=humint_api:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- security headers (module 5) --------------------------------------- #
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- authentication: strict 5/min budget ------------------------------- #
    location = /api/v1/auth/login {
        limit_req zone=humint_login burst=3 nodelay;
        proxy_pass http://humint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # --- API and tracking proxies ----------------------------------------- #
    location /api/ {
        limit_req zone=humint_api burst=20 nodelay;
        proxy_pass http://humint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Standalone micro-learning page served by the backend.
    location /training/ {
        proxy_pass http://humint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /healthz {
        proxy_pass http://humint_backend/healthz;
        access_log off;
    }

    # --- metrics: never public (module 9) ---------------------------------- #
    # The edge proxy repeats this with a Basic Auth gate; here the path is
    # always refused so no accidental direct exposure is possible.
    location = /metrics {
        return 404;
    }

    # --- static assets ----------------------------------------------------- #
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------ #
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

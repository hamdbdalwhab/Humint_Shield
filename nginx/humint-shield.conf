# ---------------------------------------------------------------------------
# HUMINT Shield - edge reverse proxy (TLS termination).
#
# Mount into /etc/nginx/conf.d/ and provide certificates via certbot or your PKI.
# This is the only public listener: it redirects HTTP to HTTPS, sets the
# transport/security headers and applies network-level rate limits.
#
#   ENABLE_EDGE_PROXY=1 docker compose -f docker-compose.yml -f nginx/docker-compose.edge.yml up -d
#
# Metrics: create /etc/nginx/.metrics_htpasswd (see DEPLOYMENT.md) and keep
# METRICS_ENABLED=true only on the internal backend listener.
# ---------------------------------------------------------------------------
upstream humint_frontend {
    server frontend:80;
    keepalive 16;
}

# --- network-level rate limiting (module 6) -------------------------------- #
limit_req_zone $binary_remote_addr zone=humint_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=humint_api:10m rate=60r/m;
limit_req_status 429;

# --- HTTP: redirect everything to HTTPS ------------------------------------ #
server {
    listen 80;
    server_name humint.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: edge termination ---------------------------------------------- #
server {
    listen 443 ssl;
    http2 on;
    server_name humint.example.com;

    ssl_certificate     /etc/letsencrypt/live/humint.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humint.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # --- security headers (module 5) --------------------------------------- #
    # HSTS is served only over HTTPS; browsers ignore it on plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 10m;
    server_tokens off;

    # --- authentication: 5 requests/minute/IP ------------------------------ #
    location = /api/v1/auth/login {
        limit_req zone=humint_login burst=3 nodelay;
        proxy_pass http://humint_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # --- metrics: internal networks only + Basic Auth (module 9) ----------- #
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        auth_basic "HUMINT Shield metrics";
        auth_basic_user_file /etc/nginx/.metrics_htpasswd;

        proxy_pass http://humint_frontend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location / {
        limit_req zone=humint_api burst=20 nodelay;
        proxy_pass http://humint_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

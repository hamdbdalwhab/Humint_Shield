# ---------------------------------------------------------------------------
# HUMINT Shield - optional edge reverse proxy (TLS termination).
#
# Use this when you terminate TLS at a dedicated nginx instance in front of the
# compose stack (the `frontend` service stays on plain HTTP behind it). Mount
# into /etc/nginx/conf.d/ and provide certificates via certbot or your PKI.
#
#   ENABLE_EDGE_PROXY=1 docker compose -f docker-compose.yml -f nginx/docker-compose.edge.yml up -d
# ---------------------------------------------------------------------------
upstream humint_frontend {
    server frontend:80;
    keepalive 16;
}

# --- HTTP: redirect everything to HTTPS ------------------------------------ #
server {
    listen 80;
    server_name humint.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: edge termination ---------------------------------------------- #
server {
    listen 443 ssl;
    http2 on;
    server_name humint.example.com;

    ssl_certificate     /etc/letsencrypt/live/humint.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humint.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS - enable only once you are certain every hostname is HTTPS-ready.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
    server_tokens off;

    location / {
        proxy_pass http://humint_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
